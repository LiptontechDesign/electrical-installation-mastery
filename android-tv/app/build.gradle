plugins { id 'com.android.application' }

android {
    namespace 'app.electricalmastery.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'app.electricalmastery.tv'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    // This is a directly installed personal build. Web content updates separately.
    buildTypes { debug { debuggable false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
