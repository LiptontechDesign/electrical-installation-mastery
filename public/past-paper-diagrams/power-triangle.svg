<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" role="img" aria-labelledby="title desc"><title id="title">Power-factor correction: triangle and connection</title><desc id="desc">Before correction the power triangle has active P and reactive Q1. After correction P is unchanged and Q2 equals Q1 minus capacitor Qc, reducing apparent S. The capacitor bank is in a separately protected parallel branch, not in series with the motor.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Power-factor correction: triangle and connection</text><path class="wire" d="M100 350H500V100L100 350 M100 350L500 215"/><path class="dash" d="M500 215V350"/><text x="270" y="385" class="label" text-anchor="start">P: active power</text><text x="535" y="140" class="label" text-anchor="start">Q₁</text><text x="535" y="280" class="label" text-anchor="start">Q₂</text><text x="300" y="190" class="label" text-anchor="start">S₁</text><text x="300" y="315" class="label" text-anchor="start">S₂</text><text x="590" y="185" class="label" text-anchor="start">Qᶜ = Q₁ − Q₂</text><text x="590" y="225" class="small" text-anchor="start">P stays constant.</text><text x="590" y="255" class="small" text-anchor="start">The source supplies less Q.</text><rect class="box" x="45" y="455" width="180" height="60" rx="7"/><text x="135" y="490" class="label" text-anchor="middle">Supply</text><path class="wire" d="M225 485H825V485"/><circle cx="430" cy="485" r="4" class="dot"/><path class="wire" d="M430 485H430V590"/><rect class="box" x="315" y="590" width="230" height="65" rx="7"/><text x="430" y="618.5" class="label" text-anchor="middle">Capacitor protection</text><text x="430" y="639.5" class="small" text-anchor="middle">Switching and bank Qᶜ</text><rect class="box" x="655" y="455" width="200" height="60" rx="7"/><text x="755" y="481" class="label" text-anchor="middle">Motor protection</text><text x="755" y="502" class="small" text-anchor="middle">Motor P and Q₁</text><text x="35" y="710" class="small" text-anchor="start">Capacitor bank is connected in parallel. Motor-branch current differs from corrected source current.</text></svg>