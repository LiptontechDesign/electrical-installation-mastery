<svg xmlns="http://www.w3.org/2000/svg" width="900" height="595" viewBox="0 0 900 595" role="img" aria-labelledby="title desc"><title id="title">Three-position lamp control</title><desc id="desc">Line connects to the common of the first two-way switch. Its two travellers pass through a four-terminal intermediate switch to the travellers of the second two-way switch. The second common feeds the lamp, which returns to neutral. The intermediate crossing has no electrical junction. CPC continuity is required.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Three-position lamp control</text><text x="50" y="100" class="label" text-anchor="start">L</text><path class="wire" d="M50 130H180V130"/><path class="wire" d="M180 130V250L270 190"/><circle cx="180" cy="250" r="4" class="dot"/><circle cx="270" cy="190" r="4" class="dot"/><circle cx="270" cy="310" r="4" class="dot"/><path class="wire" d="M270 190H440V190"/><path class="wire" d="M270 310H440V310"/><rect class="box" x="440" y="155" width="130" height="190" rx="7"/><text x="505" y="255" class="label" text-anchor="middle"></text><text x="505" y="135" class="label" text-anchor="middle">Intermediate</text><path class="wire" d="M440 190L570 310 M440 310L570 190"/><path class="wire" d="M570 190H710V190"/><path class="wire" d="M570 310H710V310"/><circle cx="710" cy="190" r="4" class="dot"/><circle cx="710" cy="310" r="4" class="dot"/><circle cx="785" cy="250" r="4" class="dot"/><path class="wire" d="M710 190L785 250H850V360"/><circle class="box" cx="850" cy="380" r="20"/><path class="wire" d="M837 367L863 393 M837 393L863 367"/><path class="wire" d="M850 400H850V460"/><path class="wire" d="M50 460H850V460"/><text x="50" y="445" class="label" text-anchor="start">N</text><text x="210" y="370" class="label" text-anchor="middle">Two-way 1</text><text x="755" y="370" class="label" text-anchor="middle">Two-way 2</text><text x="490" y="405" class="small" text-anchor="middle">Crossed position shown; crossing is not a junction.</text><text x="35" y="525" class="small" text-anchor="start">The intermediate passes straight through or swaps the two travellers. Any switch changes the lamp state.</text><text x="35" y="560" class="small" text-anchor="start">CPC remains continuous to all exposed-conductive-parts requiring protection (not shown in this functional view).</text></svg>