<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">Fall-of-potential electrode-resistance test</title><desc id="desc">Tester E lead connects to electrode under test, P to a potential probe between E and remote current electrode C. Reposition P and compare results to establish a stable region. Safe isolation is required before disconnecting a protective earthing connection.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Fall-of-potential electrode-resistance test</text><rect class="box" x="300" y="100" width="300" height="80" rx="7"/><text x="450" y="136" class="label" text-anchor="middle">Earth-resistance tester</text><text x="450" y="157" class="small" text-anchor="middle">Separate E · P · C terminals</text><path class="wire" d="M350 180V220H125V350"/><path class="wire" d="M450 180V260H450V350"/><path class="wire" d="M550 180V220H780V350"/><path class="dash" d="M50 350H850"/><path class="pe" d="M125 350H125V362"/><path class="pe" d="M105 362h40 M112 370h26 M119 378h12"/><path class="pe" d="M450 350H450V362"/><path class="pe" d="M430 362h40 M437 370h26 M444 378h12"/><path class="pe" d="M780 350H780V362"/><path class="pe" d="M760 362h40 M767 370h26 M774 378h12"/><text x="125" y="420" class="label" text-anchor="middle">E: electrode under test</text><text x="450" y="420" class="label" text-anchor="middle">P: potential probe</text><text x="780" y="420" class="label" text-anchor="middle">C: current probe</text><text x="450" y="470" class="label" text-anchor="middle">Move P either side of the nominal point; compare readings.</text><text x="450" y="505" class="small" text-anchor="middle">C must be sufficiently remote for this electrode system and soil.</text><text x="450" y="540" class="small" text-anchor="middle">Use safe isolation before removing an earthing connection; restore and verify afterwards.</text></svg>