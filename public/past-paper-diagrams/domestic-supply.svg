<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Single-phase domestic distribution</title><desc id="desc">Supply service protection feeds meter, main isolator and consumer unit. Separate lighting, socket and appliance RCBOs supply final circuits. CPCs and bonding connect to the main earthing terminal and assessed means of earthing.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Single-phase domestic distribution</text><path class="wire" d="M40 130H850V130"/><rect class="box" x="70" y="100" width="150" height="60" rx="7"/><text x="145" y="135" class="label" text-anchor="middle">Service protection</text><rect class="box" x="280" y="100" width="125" height="60" rx="7"/><text x="342.5" y="135" class="label" text-anchor="middle">Meter</text><rect class="box" x="465" y="100" width="150" height="60" rx="7"/><text x="540" y="135" class="label" text-anchor="middle">Main isolator</text><rect class="box" x="685" y="100" width="150" height="60" rx="7"/><text x="760" y="135" class="label" text-anchor="middle">Consumer unit</text><path class="wire" d="M760 160H760V235"/><path class="wire" d="M760 235H580V235"/><rect class="box" x="385" y="208" width="195" height="54" rx="7"/><text x="482.5" y="240" class="label" text-anchor="middle">Lighting RCBO</text><path class="wire" d="M385 235H220V235"/><rect class="box" x="60" y="208" width="160" height="54" rx="7"/><text x="140" y="240" class="label" text-anchor="middle">Lighting</text><path class="wire" d="M760 160H760V325"/><path class="wire" d="M760 325H580V325"/><rect class="box" x="385" y="298" width="195" height="54" rx="7"/><text x="482.5" y="330" class="label" text-anchor="middle">Socket RCBO</text><path class="wire" d="M385 325H220V325"/><rect class="box" x="60" y="298" width="160" height="54" rx="7"/><text x="140" y="330" class="label" text-anchor="middle">Socket outlets</text><path class="wire" d="M760 160H760V415"/><path class="wire" d="M760 415H580V415"/><rect class="box" x="385" y="388" width="195" height="54" rx="7"/><text x="482.5" y="420" class="label" text-anchor="middle">Appliance RCBO</text><path class="wire" d="M385 415H220V415"/><rect class="box" x="60" y="388" width="160" height="54" rx="7"/><text x="140" y="420" class="label" text-anchor="middle">Dedicated load</text><path class="pe" d="M65 485H820V485"/><rect class="box" x="65" y="465" width="85" height="40" rx="7"/><text x="107.5" y="490" class="label" text-anchor="middle">MET</text><path class="pe" d="M185 485H185V497"/><path class="pe" d="M165 497h40 M172 505h26 M179 513h12"/><text x="230" y="512" class="small" text-anchor="start">CPCs and required bonding connect to MET; never use PE as neutral.</text><text x="32" y="555" class="small" text-anchor="start">One-line arrangement: each circuit includes its required line, neutral and CPC. Ratings are design-dependent.</text></svg>