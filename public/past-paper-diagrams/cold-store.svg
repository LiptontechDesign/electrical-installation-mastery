<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc"><title id="title">Cold-store building: three named levels</title><desc id="desc">Stated 120 A TPN incomer feeds protected ground, first and second floor boards. Ground has 400 W lighting; first has 12 kW three-phase cold store, lighting and ring; second has lighting, ring, three separate 4 kW autoclaves and separate AC1 and AC2 circuits.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Cold-store building: three named levels</text><rect class="box" x="35" y="100" width="200" height="65" rx="7"/><text x="135" y="128.5" class="label" text-anchor="middle">Supply and metering</text><text x="135" y="149.5" class="small" text-anchor="middle">L1 · L2 · L3 · N</text><path class="wire" d="M235 132H285V132"/><rect class="box" x="285" y="100" width="210" height="65" rx="7"/><text x="390" y="128.5" class="label" text-anchor="middle">120 A TPN incomer</text><text x="390" y="149.5" class="small" text-anchor="middle">Stated arrangement</text><path class="wire" d="M495 132H550V132"/><path class="wire" d="M550 132H550V690"/><circle cx="550" cy="240" r="4" class="dot"/><path class="wire" d="M550 240H610V240"/><rect class="box" x="610" y="205" width="250" height="70" rx="7"/><text x="735" y="236" class="label" text-anchor="middle">Ground-floor DB</text><text x="735" y="257" class="small" text-anchor="middle">Lighting: 400 W</text><circle cx="550" cy="420" r="4" class="dot"/><path class="wire" d="M550 420H610V420"/><rect class="box" x="610" y="385" width="250" height="70" rx="7"/><text x="735" y="416" class="label" text-anchor="middle">First-floor DB</text><text x="735" y="437" class="small" text-anchor="middle">Cold store, lighting, ring</text><circle cx="550" cy="640" r="4" class="dot"/><path class="wire" d="M550 640H610V640"/><rect class="box" x="610" y="605" width="250" height="70" rx="7"/><text x="735" y="636" class="label" text-anchor="middle">Second-floor DB</text><text x="735" y="657" class="small" text-anchor="middle">Equipment and final circuits</text><text x="40" y="215" class="label" text-anchor="start">Ground: 20 × 15 W + 2 × 50 W</text><text x="40" y="255" class="small" text-anchor="start">Separate lighting protection and isolation.</text><text x="40" y="360" class="label" text-anchor="start">First floor:</text><text x="40" y="395" class="label" text-anchor="start">• 12 kW three-phase cold store</text><text x="40" y="425" class="label" text-anchor="start">• Lighting circuit(s)</text><text x="40" y="455" class="label" text-anchor="start">• Ring final circuit</text><text x="40" y="530" class="label" text-anchor="start">Second floor:</text><text x="40" y="565" class="label" text-anchor="start">• Lighting and ring final circuits</text><text x="40" y="595" class="label" text-anchor="start">• Three separate 4 kW autoclave circuits</text><text x="40" y="625" class="label" text-anchor="start">• AC1 on its own circuit</text><text x="40" y="655" class="label" text-anchor="start">• AC2 on its own circuit</text><text x="35" y="745" class="small" text-anchor="start">Each DB feeder is separately protected. N, CPC, equipment isolation and required bonding are included.</text><text x="35" y="772" class="small" text-anchor="start">Feeder and final-circuit ratings require the complete load schedule and cable/protection calculations.</text></svg>