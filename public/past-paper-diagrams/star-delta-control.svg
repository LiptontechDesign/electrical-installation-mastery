<svg xmlns="http://www.w3.org/2000/svg" width="900" height="725" viewBox="0 0 900 725" role="img" aria-labelledby="title desc"><title id="title">Star-delta starter: control sequence</title><desc id="desc">NC Stop and overload enable every rung. Start with KM auxiliary holding energises main contactor and timer. Star KY needs KM NO, timer NC and delta KD NC; delta KD needs KM NO, timer NO and star KY NC. Transition must break star before making delta, with mechanical and electrical interlocks.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Star-delta starter: control sequence</text><text x="35" y="90" class="label" text-anchor="start">COMMON ENABLE: protected control supply → NC Stop → NC overload</text><path class="wire" d="M45 130H855V575 M45 130V575"/><text x="45" y="120" class="small" text-anchor="start">Enabled L</text><text x="855" y="120" class="small" text-anchor="start">Return</text><path class="wire" d="M45 205H855V205"/><rect class="box" x="95" y="180" width="155" height="50" rx="7"/><text x="172.5" y="210" class="label" text-anchor="middle">Start / KM hold</text><rect class="box" x="715" y="180" width="110" height="50" rx="7"/><text x="770" y="210" class="label" text-anchor="middle">KM + timer</text><text x="325" y="260" class="small" text-anchor="start">Start and KM NO hold are parallel</text><path class="wire" d="M45 350H855V350"/><rect class="box" x="95" y="325" width="155" height="50" rx="7"/><text x="172.5" y="355" class="label" text-anchor="middle">KM (NO)</text><rect class="box" x="285" y="325" width="155" height="50" rx="7"/><text x="362.5" y="355" class="label" text-anchor="middle">Timer (NC)</text><rect class="box" x="475" y="325" width="155" height="50" rx="7"/><text x="552.5" y="355" class="label" text-anchor="middle">KD (NC)</text><rect class="box" x="715" y="325" width="110" height="50" rx="7"/><text x="770" y="355" class="label" text-anchor="middle">KY star</text><path class="wire" d="M45 495H855V495"/><rect class="box" x="95" y="470" width="155" height="50" rx="7"/><text x="172.5" y="500" class="label" text-anchor="middle">KM (NO)</text><rect class="box" x="285" y="470" width="155" height="50" rx="7"/><text x="362.5" y="500" class="label" text-anchor="middle">Timer (NO)</text><rect class="box" x="475" y="470" width="155" height="50" rx="7"/><text x="552.5" y="500" class="label" text-anchor="middle">KY (NC)</text><rect class="box" x="715" y="470" width="110" height="50" rx="7"/><text x="770" y="500" class="label" text-anchor="middle">KD delta</text><text x="35" y="625" class="small" text-anchor="start">KM stays closed. Timer opens the star path before enabling delta: break-before-make transition.</text><text x="35" y="660" class="small" text-anchor="start">KY and KD require electrical cross-interlocks and a suitable mechanical interlock.</text><text x="35" y="695" class="small" text-anchor="start">Functional sequence diagram: use the manufacturer’s dedicated transition timer and wiring details.</text></svg>