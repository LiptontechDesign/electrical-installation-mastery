<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">DOL starter: power and holding control</title><desc id="desc">Power flows through short-circuit protection, K1 contactor and overload to the motor. Control flows through NC Stop and overload contacts, then parallel NO Start and K1 auxiliary contacts, then K1 coil. The holding contact cannot bypass Stop or overload.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">DOL starter: power and holding control</text><text x="35" y="85" class="small" text-anchor="start">POWER CIRCUIT</text><rect class="box" x="40" y="115" width="175" height="65" rx="7"/><text x="127.5" y="143.5" class="label" text-anchor="middle">Three-phase supply</text><text x="127.5" y="164.5" class="small" text-anchor="middle">L1 · L2 · L3</text><path class="wire" d="M215 147H260V147"/><rect class="box" x="260" y="115" width="165" height="65" rx="7"/><text x="342.5" y="143.5" class="label" text-anchor="middle">Short-circuit</text><text x="342.5" y="164.5" class="small" text-anchor="middle">protection</text><path class="wire" d="M425 147H470V147"/><rect class="box" x="470" y="115" width="120" height="65" rx="7"/><text x="530" y="143.5" class="label" text-anchor="middle">K1</text><text x="530" y="164.5" class="small" text-anchor="middle">Contactor</text><path class="wire" d="M590 147H625V147"/><rect class="box" x="625" y="115" width="115" height="65" rx="7"/><text x="682.5" y="143.5" class="label" text-anchor="middle">OL</text><text x="682.5" y="164.5" class="small" text-anchor="middle">Overload</text><path class="wire" d="M740 147H775V147"/><rect class="box" x="775" y="115" width="90" height="65" rx="7"/><text x="820" y="152.5" class="label" text-anchor="middle">Motor</text><text x="35" y="230" class="small" text-anchor="start">CONTROL CIRCUIT — separate correctly rated control protection</text><path class="wire" d="M40 300H860V300"/><rect class="box" x="70" y="275" width="120" height="50" rx="7"/><text x="130" y="305" class="label" text-anchor="middle">Stop (NC)</text><rect class="box" x="225" y="275" width="120" height="50" rx="7"/><text x="285" y="305" class="label" text-anchor="middle">OL (NC)</text><rect class="box" x="410" y="275" width="145" height="50" rx="7"/><text x="482.5" y="305" class="label" text-anchor="middle">Start (NO)</text><rect class="box" x="725" y="275" width="115" height="50" rx="7"/><text x="782.5" y="305" class="label" text-anchor="middle">K1 coil</text><path class="wire" d="M380 300V400H590V300"/><rect class="box" x="410" y="375" width="145" height="50" rx="7"/><text x="482.5" y="405" class="label" text-anchor="middle">K1 aux (NO)</text><circle cx="380" cy="300" r="4" class="dot"/><circle cx="590" cy="300" r="4" class="dot"/><text x="40" y="280" class="small" text-anchor="start">L</text><text x="860" y="280" class="small" text-anchor="start">N</text><text x="35" y="480" class="small" text-anchor="start">K1 auxiliary contact holds the coil after Start is released. Stop and OL remain in series with both paths.</text><text x="35" y="515" class="small" text-anchor="start">CPC remains connected to the motor frame. NC/NO states are shown with the coil de-energised.</text></svg>