<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Star and delta winding connections</title><desc id="desc">Star supplies U1 V1 W1 and links U2 V2 W2. Delta joins U1/W2 to L1, V1/U2 to L2 and W1/V2 to L3, so each winding lies between two lines. Balanced star and delta line/phase relationships are stated.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Star and delta winding connections</text><text x="195" y="100" class="heading" text-anchor="middle">STAR (Y)</text><text x="655" y="100" class="heading" text-anchor="middle">DELTA (Δ)</text><text x="100" y="145" class="label" text-anchor="middle">L1 / U1</text><path class="wire" d="M100 160H100V330"/><rect class="box" x="77" y="205" width="46" height="75" rx="7"/><text x="100" y="247.5" class="label" text-anchor="middle">U</text><circle cx="100" cy="330" r="4" class="dot"/><text x="100" y="365" class="label" text-anchor="middle">U2</text><text x="200" y="145" class="label" text-anchor="middle">L2 / V1</text><path class="wire" d="M200 160H200V330"/><rect class="box" x="177" y="205" width="46" height="75" rx="7"/><text x="200" y="247.5" class="label" text-anchor="middle">V</text><circle cx="200" cy="330" r="4" class="dot"/><text x="200" y="365" class="label" text-anchor="middle">V2</text><text x="300" y="145" class="label" text-anchor="middle">L3 / W1</text><path class="wire" d="M300 160H300V330"/><rect class="box" x="277" y="205" width="46" height="75" rx="7"/><text x="300" y="247.5" class="label" text-anchor="middle">W</text><circle cx="300" cy="330" r="4" class="dot"/><text x="300" y="365" class="label" text-anchor="middle">W2</text><path class="wire" d="M100 330H300V330"/><text x="200" y="405" class="small" text-anchor="middle">U2 · V2 · W2 linked</text><path class="wire" d="M650 175L490 385L810 385Z"/><circle cx="650" cy="175" r="4" class="dot"/><circle cx="490" cy="385" r="4" class="dot"/><circle cx="810" cy="385" r="4" class="dot"/><rect class="box" x="530" y="250" width="80" height="60" rx="7"/><text x="570" y="285" class="label" text-anchor="middle">U coil</text><rect class="box" x="690" y="250" width="80" height="60" rx="7"/><text x="730" y="285" class="label" text-anchor="middle">W coil</text><rect class="box" x="610" y="358" width="80" height="55" rx="7"/><text x="650" y="390.5" class="label" text-anchor="middle">V coil</text><text x="650" y="145" class="label" text-anchor="middle">L1: U1 + W2</text><text x="490" y="430" class="label" text-anchor="middle">L2: V1 + U2</text><text x="810" y="430" class="label" text-anchor="middle">L3: W1 + V2</text><text x="35" y="490" class="label" text-anchor="start">Star: winding voltage = line voltage / √3; line current = winding current.</text><text x="35" y="525" class="label" text-anchor="start">Delta: winding voltage = line voltage; line current = √3 × winding current.</text></svg>