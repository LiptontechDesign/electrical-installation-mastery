<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-labelledby="title desc"><title id="title">Earthing systems and the protective path</title><desc id="desc">TN-S has separate neutral and PE throughout. TN-C-S uses a supply PEN split into separate N and PE at the designated point. TT has a consumer electrode independent of the source electrode. TN-C combines neutral and protective functions in a PEN throughout the relevant portion.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Earthing systems and the protective path</text><text x="35" y="100" class="heading" text-anchor="start">TN-S</text><rect class="box" x="35" y="125" width="115" height="65" rx="7"/><text x="92.5" y="153.5" class="label" text-anchor="middle">Source</text><text x="92.5" y="174.5" class="small" text-anchor="middle">Earthed neutral</text><path class="wire" d="M150 145H820V145"/><text x="840" y="150" class="label" text-anchor="start">L</text><path class="wire" d="M150 175H820V175"/><text x="840" y="180" class="label" text-anchor="start">N</text><path class="pe" d="M175 175H175V187"/><path class="pe" d="M155 187h40 M162 195h26 M169 203h12"/><path class="pe" d="M175 175H175V230"/><path class="pe" d="M175 230H750V230"/><rect class="box" x="750" y="210" width="90" height="40" rx="7"/><text x="795" y="235" class="label" text-anchor="middle">MET</text><text x="315" y="250" class="small" text-anchor="start">Separate N and PE throughout</text><text x="35" y="290" class="heading" text-anchor="start">TN-C-S</text><rect class="box" x="35" y="315" width="115" height="65" rx="7"/><text x="92.5" y="343.5" class="label" text-anchor="middle">Source</text><text x="92.5" y="364.5" class="small" text-anchor="middle">Earthed neutral</text><path class="wire" d="M150 335H820V335"/><text x="840" y="340" class="label" text-anchor="start">L</text><path class="wire" d="M150 365H820V365"/><text x="840" y="370" class="label" text-anchor="start">N</text><path class="pe" d="M175 365H175V377"/><path class="pe" d="M155 377h40 M162 385h26 M169 393h12"/><text x="305" y="357" class="small" text-anchor="start">PEN</text><circle cx="520" cy="365" r="4" class="dot"/><path class="pe" d="M520 365H520V420"/><path class="pe" d="M520 420H750V420"/><rect class="box" x="750" y="400" width="90" height="40" rx="7"/><text x="795" y="425" class="label" text-anchor="middle">MET</text><text x="285" y="465" class="small" text-anchor="start">Separate N and PE after designated split</text><text x="35" y="480" class="heading" text-anchor="start">TT</text><rect class="box" x="35" y="505" width="115" height="65" rx="7"/><text x="92.5" y="533.5" class="label" text-anchor="middle">Source</text><text x="92.5" y="554.5" class="small" text-anchor="middle">Earthed neutral</text><path class="wire" d="M150 525H820V525"/><text x="840" y="530" class="label" text-anchor="start">L</text><path class="wire" d="M150 555H820V555"/><text x="840" y="560" class="label" text-anchor="start">N</text><path class="pe" d="M175 555H175V567"/><path class="pe" d="M155 567h40 M162 575h26 M169 583h12"/><rect class="box" x="750" y="590" width="90" height="40" rx="7"/><text x="795" y="615" class="label" text-anchor="middle">MET</text><path class="pe" d="M750 610H620V610"/><path class="pe" d="M620 610H620V622"/><path class="pe" d="M600 622h40 M607 630h26 M614 638h12"/><text x="285" y="650" class="small" text-anchor="start">Consumer electrode independent of source electrode</text><text x="35" y="700" class="small" text-anchor="start">TN-C: a PEN combines neutral and protective functions throughout the relevant system portion.</text><text x="35" y="730" class="small" text-anchor="start">L lines represent all required phase conductors. MET connects the installation CPCs and required bonding.</text><text x="35" y="758" class="small" text-anchor="start">No arbitrary downstream neutral-to-PE links. TT commonly requires RCD fault protection.</text></svg>