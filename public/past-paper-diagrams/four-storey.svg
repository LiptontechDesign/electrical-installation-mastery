<svg xmlns="http://www.w3.org/2000/svg" width="900" height="585" viewBox="0 0 900 585" role="img" aria-labelledby="title desc"><title id="title">Four-storey office distribution</title><desc id="desc">Three-phase intake feeds a main switchboard with separately protected submains to ground, first, second and third floor distribution boards. Each board supplies lighting, socket and dedicated equipment circuits with neutral and CPC provisions.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Four-storey office distribution</text><rect class="box" x="45" y="100" width="190" height="65" rx="7"/><text x="140" y="128.5" class="label" text-anchor="middle">Supply and meter</text><text x="140" y="149.5" class="small" text-anchor="middle">L1 · L2 · L3 · N</text><path class="wire" d="M235 132H290V132"/><rect class="box" x="290" y="100" width="235" height="65" rx="7"/><text x="407.5" y="128.5" class="label" text-anchor="middle">Main switchboard</text><text x="407.5" y="149.5" class="small" text-anchor="middle">Isolation and protection</text><path class="wire" d="M525 132H570V132"/><path class="wire" d="M570 132H570V505"/><circle cx="570" cy="225" r="4" class="dot"/><path class="wire" d="M570 225H650V225"/><rect class="box" x="650" y="197" width="205" height="56" rx="7"/><text x="752.5" y="221" class="label" text-anchor="middle">Ground-floor DB</text><text x="752.5" y="242" class="small" text-anchor="middle">Protected submain</text><circle cx="570" cy="315" r="4" class="dot"/><path class="wire" d="M570 315H650V315"/><rect class="box" x="650" y="287" width="205" height="56" rx="7"/><text x="752.5" y="311" class="label" text-anchor="middle">First-floor DB</text><text x="752.5" y="332" class="small" text-anchor="middle">Protected submain</text><circle cx="570" cy="405" r="4" class="dot"/><path class="wire" d="M570 405H650V405"/><rect class="box" x="650" y="377" width="205" height="56" rx="7"/><text x="752.5" y="401" class="label" text-anchor="middle">Second-floor DB</text><text x="752.5" y="422" class="small" text-anchor="middle">Protected submain</text><circle cx="570" cy="495" r="4" class="dot"/><path class="wire" d="M570 495H650V495"/><rect class="box" x="650" y="467" width="205" height="56" rx="7"/><text x="752.5" y="491" class="label" text-anchor="middle">Third-floor DB</text><text x="752.5" y="512" class="small" text-anchor="middle">Protected submain</text><text x="45" y="235" class="label" text-anchor="start">Each floor board supplies:</text><text x="45" y="270" class="label" text-anchor="start">• Separate lighting circuits</text><text x="45" y="300" class="label" text-anchor="start">• Socket circuits</text><text x="45" y="330" class="label" text-anchor="start">• Dedicated equipment circuits</text><text x="45" y="375" class="small" text-anchor="start">Allocate single-phase loads across L1, L2 and L3.</text><text x="45" y="405" class="small" text-anchor="start">Provide N and CPC continuity, earthing and bonding.</text><text x="45" y="555" class="small" text-anchor="start">Life-safety services require their applicable specialist design and continuity arrangements.</text></svg>