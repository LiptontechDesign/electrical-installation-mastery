<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" role="img" aria-labelledby="title desc"><title id="title">Lightning protection: main components</title><desc id="desc">Roof air terminations connect through down conductors and test joints to the earth-termination system. Designed bonding or separation controls dangerous sparking; internal SPDs are coordinated with the overall protection. The drawing is a component overview, not a dimensioned design.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">Lightning protection: main components</text><path class="wire" d="M175 235L450 100L725 235 M200 225V530H700V225 M205 220V575 M695 220V575"/><path class="wire" d="M450 100V65 M330 160V115 M570 160V115"/><path class="pe" d="M205 225V575 M695 225V575"/><path class="pe" d="M205 575H205V587"/><path class="pe" d="M185 587h40 M192 595h26 M199 603h12"/><path class="pe" d="M695 575H695V587"/><path class="pe" d="M675 587h40 M682 595h26 M689 603h12"/><rect class="box" x="350" y="320" width="200" height="70" rx="7"/><text x="450" y="351" class="label" text-anchor="middle">MET / bonding</text><text x="450" y="372" class="small" text-anchor="middle">Designed separation</text><path class="pe" d="M205 405H350V355"/><path class="pe" d="M550 355H695V405"/><circle cx="205" cy="515" r="4" class="dot"/><circle cx="695" cy="515" r="4" class="dot"/><text x="450" y="205" class="label" text-anchor="middle">Air-termination system</text><text x="45" y="295" class="small" text-anchor="start">Down conductor</text><text x="705" y="295" class="small" text-anchor="start">Down conductor</text><text x="250" y="520" class="small" text-anchor="start">Test joint</text><text x="450" y="680" class="label" text-anchor="middle">Earth-termination system and coordinated internal surge protection</text><text x="450" y="720" class="small" text-anchor="middle">Risk assessment determines interception, separation, bonding and SPD requirements.</text></svg>