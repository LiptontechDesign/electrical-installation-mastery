<svg xmlns="http://www.w3.org/2000/svg" width="900" height="605" viewBox="0 0 900 605" role="img" aria-labelledby="title desc"><title id="title">One phase-power measurement</title><desc id="desc">Wattmeter current input is in series with the selected phase load and voltage input is across that phase and neutral. Repeat with an appropriately rated selector for each phase of a sufficiently steady four-wire load and sum the three readings. Multiply by three only for a balanced steady load.</desc><style>svg{background:#fff} text{font-family:Arial,Helvetica,sans-serif;fill:#162638}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#40536a}.wire{fill:none;stroke:#1f4269;stroke-width:2.5;stroke-linejoin:round}.pe{fill:none;stroke:#17754e;stroke-width:2.5}.box{fill:#f3f7fb;stroke:#52708e;stroke-width:1.5}.dot{fill:#1f4269}.dash{fill:none;stroke:#8396aa;stroke-width:1.5;stroke-dasharray:7 5}</style><text x="32" y="40" class="heading" text-anchor="start">One phase-power measurement</text><text x="40" y="135" class="label" text-anchor="start">Selected phase</text><path class="wire" d="M40 180H840V180"/><rect class="box" x="235" y="150" width="170" height="60" rx="7"/><text x="320" y="176" class="label" text-anchor="middle">Current input</text><text x="320" y="197" class="small" text-anchor="middle">In series with load</text><rect class="box" x="700" y="150" width="145" height="60" rx="7"/><text x="772.5" y="185" class="label" text-anchor="middle">Phase load</text><path class="wire" d="M40 440H840V440"/><text x="40" y="475" class="label" text-anchor="start">Neutral</text><path class="wire" d="M840 210H840V440"/><circle cx="495" cy="180" r="4" class="dot"/><circle cx="495" cy="440" r="4" class="dot"/><path class="wire" d="M495 180H495V440"/><rect class="box" x="425" y="265" width="140" height="70" rx="7"/><text x="495" y="296" class="label" text-anchor="middle">Voltage input</text><text x="495" y="317" class="small" text-anchor="middle">Phase to neutral</text><path class="dash" d="M210 125H590V360H210Z"/><text x="220" y="395" class="small" text-anchor="start">One suitable wattmeter</text><text x="35" y="535" class="small" text-anchor="start">Repeat for L1–N, L2–N and L3–N using a rated selector arrangement and sufficiently steady load.</text><text x="35" y="570" class="small" text-anchor="start">Unbalanced four-wire load: P = P₁ + P₂ + P₃. Balanced steady load only: P = 3 × one phase reading.</text></svg>